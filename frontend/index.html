<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Production Security & Hardening Meta Tags -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>FinTracker &amp; Investment - by Team HAWKS Intelligence</title>
  <meta name="author" content="Team HAWKS Intelligence, BSc AI Student, New College" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700,800&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinTracker" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#04100d">
</head>

<body>
  <div id="root"></div>
  <script>
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML = `
            <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #080d14; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box;">
              <div style="background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); padding: 8px 16px; border-radius: 9999px; color: #34d399; font-size: 13px; font-weight: 600; margin-bottom: 16px;">
                FinTracker &amp; Investment
              </div>
              <h2 style="font-size: 26px; font-weight: 700; margin: 0 0 12px 0; color: #ffffff;">Please Open via Web Server</h2>
              <p style="color: #94a3b8; max-width: 520px; line-height: 1.6; margin: 0 0 24px 0; font-size: 15px;">
                You opened this file directly from your disk (<code>file://</code>). Modern React &amp; Vite web applications cannot load via direct file clicks because browser security blocks ES modules without a local HTTP server.
              </p>
              <div style="background: #0f172a; border: 1px solid #1e293b; padding: 14px 24px; border-radius: 10px; font-family: monospace; font-size: 14px; color: #38bdf8; margin-bottom: 24px; user-select: all;">
                http://localhost:5173/
              </div>
              <a href="http://localhost:5173/" style="display: inline-block; background: #10b981; color: #022c22; text-decoration: none; font-weight: 700; padding: 14px 28px; border-radius: 10px; font-size: 15px; box-shadow: 0 4px 14px rgba(16,185,129,0.3);">
                Open In Browser (http://localhost:5173/) &rarr;
              </a>
            </div>
          `;
      });
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
